<style>
:root{--bg:#F6F1E7;--ink:#1E1B16;--muted:#5A5246;--mat:#2F5E49;--accent:#C6F432}
*{box-sizing:border-box}
html,body{margin:0;background:var(--mat);color:var(--ink);font-family:'Bricolage Grotesque','Helvetica Neue',sans-serif}
a{color:inherit}
.mono{font-family:'DM Mono',monospace}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#scroller{position:relative;pointer-events:none}
header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 28px;pointer-events:none}
header>*{pointer-events:auto}
.logo,header nav a{background:var(--bg);border:1.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.logo{font-weight:800;font-size:18px;text-decoration:none;letter-spacing:-.02em;padding:7px 12px;border-radius:12px;transform:rotate(-1.5deg)}
.logo span{background:var(--accent);padding:0 6px;margin-left:6px;border-radius:4px;font-size:11px;font-weight:500}
header nav a{display:inline-block;font-size:13px;text-decoration:none;padding:9px 15px;border-radius:999px;white-space:nowrap;transform:rotate(1deg)}
#bar{position:fixed;top:0;left:0;height:5px;width:100%;transform-origin:left;transform:scaleX(0);background:var(--accent);z-index:6}
.panel{position:fixed;z-index:3;left:28px;top:50%;width:min(410px,35vw);opacity:0;visibility:hidden;display:flex;flex-direction:column;gap:13px;padding:26px;
  background:var(--bg);border-radius:6px;box-shadow:0 1px 0 rgba(0,0,0,.05),6px 10px 0 rgba(0,0,0,.22);
  background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:5px 5px;transform:translateY(-50%) rotate(-1deg)}
.panel:before{content:"";position:absolute;top:-12px;left:50%;width:96px;height:26px;transform:translateX(-50%) rotate(2deg);background:rgba(198,244,50,.75);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.panel.on{visibility:visible}
.kicker{font-size:12px;letter-spacing:.07em;color:var(--muted)}
.kicker b{background:var(--ink);color:var(--bg);font-weight:500;padding:2px 6px;border-radius:3px;margin-right:6px}
.story{margin:0;font-size:15px;font-style:italic;color:var(--muted);border-left:3px solid var(--accent);padding-left:10px}
.panel h2{margin:0;font-size:clamp(30px,3.3vw,46px);line-height:1;letter-spacing:-.04em;font-weight:800}
.panel p.d{margin:0;font-size:16px;line-height:1.55;color:var(--muted)}
.panel ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.45}
.panel li{display:flex;gap:8px}.panel li:before{content:"✂";font-size:12px;line-height:20px;flex:none}
.tech{font-size:11px;letter-spacing:.06em;align-self:flex-start;padding:5px 10px;border-radius:3px;background:var(--ink);color:var(--bg)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-block;padding:11px 18px;border-radius:999px;font-weight:600;text-decoration:none;border:1.5px solid var(--ink);font-size:15px;box-shadow:2px 2px 0 var(--ink)}
.btn.solid{background:var(--ink);color:var(--bg)}
.hint{font-size:12px;letter-spacing:.08em;color:var(--muted)}
#dots{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:4;display:flex;flex-direction:column;gap:2px;list-style:none;margin:0;padding:0}
#dots button{display:flex;align-items:center;justify-content:flex-end;gap:10px;background:none;border:0;color:var(--ink);font:inherit;font-size:11px;letter-spacing:.06em;cursor:pointer;padding:8px 0;min-height:32px}
#dots button span{opacity:0;transition:opacity .2s;background:var(--bg);padding:2px 6px;border-radius:3px}
#dots button:hover span,#dots button[aria-current="true"] span{opacity:1}
#dots button:after{content:"";width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink);background:var(--bg);transition:all .2s}
#dots button[aria-current="true"]:after{background:var(--accent);transform:scale(1.3)}
#tip{position:fixed;z-index:7;pointer-events:none;padding:9px 13px;border-radius:4px;background:var(--bg);border:1.5px solid var(--ink);font-size:13px;opacity:0;transform:translate(14px,14px);transition:opacity .15s}
#loader{position:fixed;inset:0;z-index:10;background:var(--mat);color:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .6s}
#loader b{font-size:clamp(40px,8vw,88px);letter-spacing:-.045em;font-weight:800}
#loader.done{opacity:0;pointer-events:none}
#fallback{display:none;position:fixed;inset:0;z-index:11;background:var(--bg);padding:32px;align-items:center;justify-content:center;text-align:center;flex-direction:column;gap:20px}
@media (max-width:760px),(max-aspect-ratio:1/1){
  header{padding:12px}
  .logo span{display:none}
  header nav a{padding:8px 12px;font-size:12px}
  .panel{left:12px;right:12px;top:auto;bottom:14px;width:auto;transform:rotate(-.6deg);padding:18px;gap:9px;max-height:46vh;overflow:auto}
  .panel h2{font-size:28px}
  .panel p.d{font-size:14px}
  .panel ul,.story{display:none}
  .btn{padding:9px 14px;font-size:14px}
  #dots{display:none}
}
</style>

const clamp=THREE.MathUtils.clamp,sm=x=>x*x*(3-2*x),ph=(f,a,b)=>clamp((f-a)/(b-a),0,1);
function along(route,d){const{pts,lens}=route;let k=1;while(k<lens.length-1&&lens[k]<d)k++;const seg=lens[k]-lens[k-1]||1,t=clamp((d-lens[k-1])/seg,0,1);
  const a=pts[k-1],b=pts[k];return{pos:new THREE.Vector3().lerpVectors(a,b,t),dir:Math.atan2(b.x-a.x,b.z-a.z)}}
function stateAt(s){
  const i=Math.min(Math.floor(s),N-2),f=s-i,A=stops[i],B=stops[i+1],route=routes[i];
  const rise=sm(ph(f,.1,.2)),walk=sm(ph(f,.2,.8)),down=sm(ph(f,.8,.9));
  const st={pos:new THREE.Vector3(),sit:0,face:0,walking:0,dist:0,near:f<.5?i:i+1};
  if(f<.2){st.pos.lerpVectors(A.seat,A.approach,rise);st.sit=A.type==='desk'?1-rise:0;st.face=A.face}
  else if(f<=.8){const a=along(route,route.len*walk);st.pos.copy(a.pos);st.face=a.dir;st.walking=1;st.dist=route.len*walk}
  else{st.pos.lerpVectors(B.approach,B.seat,down);st.sit=B.type==='desk'?down:0;st.face=B.face}
  return st;
}

  // camera
  frameAt(V.copy(st.pos).setY(.7),9.5,wp,wl);
  if(near.type==='desk'){mid.copy(near.pivot.position).add(V.set(0,1.1,-1)).lerp(near.seat,.22);frameAt(mid,near.p.big?12.5:9.8,dp,dl);wp.lerp(dp,sit);wl.lerp(dl,sit)}
  if(first){camPos.copy(wp);camLook.copy(wl);first=false}
  const k=reduce?1:.07;camPos.lerp(wp,k);camLook.lerp(wl,k);
  camera.position.copy(camPos);camera.lookAt(camLook);
  sun.position.copy(st.pos).add(V.set(-5,14,7));sun.target.position.copy(st.pos);
  // UI
  panels.forEach((el,i)=>{const o=clamp(1-(Math.abs(cur-i)-.1)/.12,0,1);el.style.opacity=o;el.classList.toggle('on',o>.02);el.style.pointerEvents=o>.5?'auto':'none'});
  const room=stops[Math.round(cur)].room;if(room!==lastRoom){lastRoom=room;dotBtns.forEach((b,i)=>b.setAttribute('aria-current',i===room))}
  bar.style.transform=`scaleX(${cur/(N-1)})`;
  const o=hasMouse?pick():null;
  if(o!==hover){hover=o;document.body.style.cursor=o?'pointer':'';tip.textContent=o?`Open ${o.userData.p.t} ↗`:'';tip.style.opacity=o?1:0}
  if(!reduce)spinners.forEach(s=>s.rotation.y+=dt*.5);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
