<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucas Bui — Office Tour</title>
<meta name="description" content="Walk through Lucas Bui's office: every desk he sits at is a project.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F1EC;--ink:#111111;--muted:#4A4A4A;--soft:#D6D5CF;--accent:#C6F432}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque','Helvetica Neue',sans-serif}
a{color:inherit}
.mono{font-family:'DM Mono',monospace}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#scroller{position:relative;pointer-events:none}
header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 28px;pointer-events:none}
header>*{pointer-events:auto}
.logo{font-weight:800;font-size:19px;text-decoration:none;letter-spacing:-.02em;background:var(--bg);padding:6px 10px;border-radius:10px}
.logo span{background:var(--accent);padding:0 6px;margin-left:6px;border-radius:4px;font-size:12px;font-weight:500}
header nav a{font-size:13px;text-decoration:none;padding:10px 16px;border:1.5px solid var(--ink);border-radius:999px;background:var(--bg);white-space:nowrap}
#bar{position:fixed;top:0;left:0;height:4px;width:100%;transform-origin:left;transform:scaleX(0);background:var(--ink);z-index:6}
.panel{position:fixed;z-index:3;left:28px;top:50%;width:min(420px,36vw);transform:translateY(-50%);opacity:0;visibility:hidden;display:flex;flex-direction:column;gap:14px;background:var(--bg);border:1.5px solid var(--ink);border-radius:22px;padding:26px;box-shadow:8px 8px 0 var(--ink)}
.panel.on{visibility:visible}
.kicker{font-size:12px;letter-spacing:.07em;color:var(--muted)}
.kicker b{background:var(--accent);color:var(--ink);font-weight:500;padding:2px 6px;border-radius:4px;margin-right:6px}
.story{margin:0;font-size:15px;font-style:italic;color:var(--muted);border-left:3px solid var(--accent);padding-left:10px}
.panel h2{margin:0;font-size:clamp(32px,3.4vw,48px);line-height:1;letter-spacing:-.04em;font-weight:800}
.panel p.d{margin:0;font-size:16px;line-height:1.55;color:var(--muted)}
.panel ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.45}
.panel li{display:flex;gap:8px}.panel li:before{content:"✦";font-size:11px;line-height:20px;flex:none}
.tech{font-size:11px;letter-spacing:.06em;align-self:flex-start;padding:5px 10px;border-radius:999px;background:var(--ink);color:var(--bg)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-block;padding:11px 18px;border-radius:999px;font-weight:600;text-decoration:none;border:1.5px solid var(--ink);font-size:15px}
.btn.solid{background:var(--ink);color:var(--bg)}
.hint{font-size:12px;letter-spacing:.08em;color:var(--muted)}
#dots{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:4;display:flex;flex-direction:column;gap:2px;list-style:none;margin:0;padding:0}
#dots button{display:flex;align-items:center;justify-content:flex-end;gap:10px;background:none;border:0;color:var(--ink);font:inherit;font-size:11px;letter-spacing:.06em;cursor:pointer;padding:8px 0;min-height:32px}
#dots button span{opacity:0;transition:opacity .2s;background:var(--bg);padding:2px 6px;border-radius:4px}
#dots button:hover span,#dots button[aria-current="true"] span{opacity:1}
#dots button:after{content:"";width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink);background:var(--bg);transition:all .2s}
#dots button[aria-current="true"]:after{background:var(--accent);transform:scale(1.3)}
#tip{position:fixed;z-index:7;pointer-events:none;padding:10px 14px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:13px;opacity:0;transform:translate(14px,14px);transition:opacity .15s}
#loader{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .6s}
#loader b{font-size:clamp(40px,8vw,88px);letter-spacing:-.045em;font-weight:800}
#loader.done{opacity:0;pointer-events:none}
#fallback{display:none;position:fixed;inset:0;z-index:11;background:var(--bg);padding:32px;align-items:center;justify-content:center;text-align:center;flex-direction:column;gap:20px}
@media (max-width:760px),(max-aspect-ratio:1/1){
  header{padding:12px}
  .logo span{display:none}
  header nav a{padding:8px 12px;font-size:12px}
  .panel{left:12px;right:12px;top:auto;bottom:12px;width:auto;transform:none;padding:18px;gap:10px;box-shadow:5px 5px 0 var(--ink);max-height:48vh;overflow:auto}
  .panel h2{font-size:30px}
  .panel p.d{font-size:14px}
  .panel ul{display:none}
  .btn{padding:9px 14px;font-size:14px}
  #dots{display:none}
}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>

<body>
<div id="bar"></div>
<header>
  <a href="#" class="logo" id="home">Lucas Bui<span class="mono">WEB DESIGNER</span></a>
  <nav class="mono"><a href="https://sucalb.github.io/">Classic portfolio ↗</a></nav>
</header>
<canvas id="gl" aria-hidden="true"></canvas>
<div id="scroller"></div>
<main id="panels"></main>

<div id="tip" class="mono" role="tooltip"></div>
<div id="loader" class="mono"><b>Lucas Bui</b><span id="pct">Opening the office — 0%</span></div>

<script type="module">
import * as THREE from 'three';

/* ---------- Content ---------- */
const GH='https://github.com/sucalb/';
const P={
  virlabs:{t:'VirLabs',url:'https://sucalb.github.io/VirLabs/',repo:'VirLabs',img:'virlabs',x:'HTML · JS',d:'60+ interactive simulations for teachers of math, physics, chemistry, biology, geography and IT — with a projector mode for the classroom.'},
  periodic:{t:'Periodic Table',url:'https://sucalb.github.io/PeriodicTable/',repo:'PeriodicTable',img:'periodic',x:'HTML · JS',d:'An interactive periodic table for Grade 10 chemistry: tap any element for real-life uses, images, videos and atomic models.'},
  toan:{t:'Toán Mỗi Ngày',url:'https://sucalb.github.io/toan-moi-ngay/',repo:'toan-moi-ngay',img:'toan',x:'LMS DEMO',d:'A daily math practice LMS: assigns problems by level, gives worked solutions right away and keeps a personal log of each student’s mistakes.'},
  random:{t:'Random Human',url:'https://sucalb.github.io/random-human/',repo:'random-human',img:'random',x:'JAVASCRIPT · ANIMATION',d:'Pick a student at random through 13 animated mini-games. Turns “who answers next?” into the best part of class.'},
  edu:{t:'EduResearch Hub',url:'https://sucalb.github.io/eduresearch-hub/',repo:'eduresearch-hub',img:'eduresearch',x:'NODE · GEMINI AI',d:'A science journal for young researchers: log ideas, track project progress and get feedback from teachers and an AI assistant.'},
  atlas:{t:'Atlas Ngôn ngữ',url:'https://sucalb.github.io/MappingEthnics/',repo:'MappingEthnics',img:'mapping',x:'JS · INTERACTIVE MAP',d:'A digital atlas exploring the language used about Vietnam’s 53 ethnic minorities — map, profiles, companion characters and a quiz.'},
  sort:{t:'SortShifts',url:'https://sort-shifts.vercel.app',repo:'SortShifts',img:'sortshifts',x:'TYPESCRIPT · APPS SCRIPT',d:'Schedules English teaching assistants across two campuses: auto-assigns shifts from availability, prefers back-to-back shifts and syncs both ways with Google Sheets.'},
  reg:{t:'ShiftRegister',url:'https://sucalb.github.io/ShiftRegister/',repo:'ShiftRegister',img:'shiftregister',x:'JS · APPS SCRIPT',d:'Staff pick their name, mark the shifts they can work and everything lands in a Google Sheet. Built for URANUS English Center.'},
  format:{t:'FormatWords',url:'https://format-words.vercel.app',repo:'FormatWords',img:'formatwords',x:'HTML · JS · OCR',d:'Turns multiple-choice exams from Word, PDF or photos into clean Word files — review in the browser, shuffle versions and export answer keys.'},
  uranus:{t:'Uranus Center',url:'https://uranuscenter.com',img:'uranus',x:'WEBSITE + LMS',big:true,d:'The public website and learning platform for URANUS, an exam-prep center with two campuses in Ho Chi Minh City since 2015.',
    h:['Animated solar-system hero: the name becomes the identity','LMS sign-in, practice tests and progress reports','Team directory for 30+ teachers and TAs, light / dark mode']},
  shaku:{t:'Old Shakuhachi Shop',url:'https://shakuhachishop.com',repo:'shakuhachishop',img:'shakuhachi',x:'E-COMMERCE · ADMIN',d:'An online store selling vintage shakuhachi — Edo, jinashi, jiari and Yuu flutes — to players around the world.',
    h:['Every flute listed with photos, video and an honest repair history','Custom admin panel for products and listings']},
  rent:{t:'RentTrek',url:'https://renttrek.store',repo:'renttrek',img:'renttrek',x:'E-COMMERCE · RENTAL',d:'Trekking gear rental in Vietnam: jackets, boots, backpacks and poles. Rent online, two-way shipping, return after the climb.',
    h:['Rental bag priced by the number of days (+20k/day)','Clear 4-step flow: deposit, delivery, extra days, return']},
  lumi:{t:'Lumi Travel',url:'https://sucalb.github.io/lumi-travel/',repo:'lumi-travel',img:'lumi',x:'JAVASCRIPT · ADMIN',d:'A travel agency site for China tours — tour search, visa services and an admin panel for managing tours.'},
  sac:{t:'SẮC Studio',url:'https://sucalb.github.io/sac-studio/',repo:'sac-studio',img:'sac',x:'HTML · CSS · JS',d:'A fashion storefront in bold retro-modernism: filters, quick view, cart, wishlist, flash-sale countdown and lookbook.'},
  nari:{t:'Nari Jean',url:'https://sucalb.github.io/nari-jean/',repo:'nari-jean',img:'narijean',x:'HTML · CSS',d:'An elegant, slow-living brand site for handmade bamboo and rattan furniture crafted in Vietnam.'}
};
const ROOMS=[
  {name:'Lobby',floor:0xD9D2C3,wall:0xEFEAE0,items:[],
   h:"Hi, I'm Lucas.",d:"A web designer from Vietnam. Follow me around the office — every time I sit down at a desk, there's a project on the screen."},
  {name:'Classroom',floor:0xC4D6C0,wall:0xE4EEE0,items:['virlabs','periodic','toan','random','edu','atlas'],
   story:'It started in the classroom: teachers needed visuals, not more slides.'},
  {name:'Staff Room',floor:0xD6D8B8,wall:0xEEF0D6,items:['sort','reg','format'],
   story:'Then the staff room needed help with spreadsheets and exam papers.'},
  {name:'Uranus HQ',floor:0x3A2A22,wall:0x2B1D17,items:['uranus'],dark:true,
   story:'A whole learning center moved online — it got a room of its own.'},
  {name:'Client Studio',floor:0xD9C9AE,wall:0xF0E4CF,items:['shaku','rent','lumi','sac','nari'],
   story:'Then shops came knocking: tell the brand’s story so people want to buy.'},
  {name:'Exit',floor:0xD0D0CC,wall:0xE6E6E2,items:[],
   h:'Thanks for the tour.',d:"The next desk could be yours. Have a shop, a school or a tool in mind? I design it, build it and ship it.",cta:true}
];

/* ---------- Renderer ---------- */
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas:document.getElementById('gl'),antialias:true})}
catch(e){document.getElementById('fallback').style.display='flex';document.getElementById('loader').remove();throw e}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const BG=new THREE.Color(0xF2F1EC);scene.background=BG.clone();
scene.fog=new THREE.Fog(0xF2F1EC,16,40);
const camera=new THREE.PerspectiveCamera(45,1,.1,200);
const TAN=Math.tan(THREE.MathUtils.degToRad(22.5));
scene.add(new THREE.HemisphereLight(0xffffff,0xb9b2a4,1.5));
const sun=new THREE.DirectionalLight(0xffffff,1.8);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-11,right:11,top:11,bottom:-11,near:1,far:40});sun.shadow.bias=-.0005;
scene.add(sun,sun.target);

const manager=new THREE.LoadingManager();
const pct=document.getElementById('pct');
const hideLoader=()=>document.getElementById('loader').classList.add('done');
manager.onProgress=(u,l,t)=>{pct.textContent=`Opening the office — ${Math.round(l/t*100)}%`};
manager.onLoad=hideLoader;setTimeout(hideLoader,8000);

/* ---------- Helpers ---------- */
const mats={},spinners=[];
const mat=(c,o={})=>{const k=c+JSON.stringify(o);return mats[k]||(mats[k]=new THREE.MeshStandardMaterial({color:c,roughness:.75,...o}))};
function box(w,h,d,c,x,y,z,parent,o){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),typeof c==='number'?mat(c,o):c);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;parent.add(m);return m}
function cyl(rt,rb,h,c,x,y,z,parent,seg=16){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat(c));m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m}
function canvasPlane(w,h,px,draw,parent){
  const cv=document.createElement('canvas');cv.width=px;cv.height=Math.round(px*h/w);
  draw(cv.getContext('2d'),cv.width,cv.height);
  const tex=new THREE.CanvasTexture(cv);tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=4;
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshStandardMaterial({map:tex,roughness:.9,transparent:true}));m.receiveShadow=true;parent.add(m);return m;
}
const font=(w,s,f='Bricolage Grotesque')=>`${w} ${s}px "${f}", sans-serif`;

/* ---------- Monitors ---------- */
const imgLoader=new THREE.ImageLoader(manager);
const TW=1200,TH=889,BAR=56;
function screenTexture(p){
  const cv=document.createElement('canvas');cv.width=TW;cv.height=TH;
  const x=cv.getContext('2d');x.fillStyle='#222';x.fillRect(0,0,TW,TH);
  const tex=new THREE.CanvasTexture(cv);tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=8;
  imgLoader.load('img/'+p.img+'.webp',img=>{
    x.fillStyle='#F2F1EC';x.fillRect(0,0,TW,BAR);
    x.drawImage(img,0,BAR,TW,TH-BAR);
    x.strokeStyle='#111';x.lineWidth=2;
    [36,64,92].forEach(cx=>{x.beginPath();x.arc(cx,BAR/2,8,0,7);x.stroke()});
    x.fillStyle='#fff';x.beginPath();x.roundRect(124,12,380,BAR-24,16);x.fill();
    x.fillStyle='#555';x.font='500 20px "DM Mono", monospace';x.textBaseline='middle';
    x.fillText(p.url.replace(/^https?:\/\//,'').replace(/\/$/,''),142,BAR/2+1);
    tex.needsUpdate=true;
  });
  return tex;
}

/* ---------- Office layout ---------- */
const SPACING=3.1,AISLE_Z=.6,SEAT_Z=-.75,DESK_Z=-1.75;
const stops=[],roomStart=[],screens=[];
let X=0;
ROOMS.forEach((r,ri)=>{
  const g=new THREE.Group();scene.add(g);
  const n=r.items.length,W=Math.max(7,n*SPACING+2.6),x0=X,cx=x0+W/2;
  // floor, back wall, partition with a doorway towards the aisle
  const floor=box(W,.12,14,r.floor,cx,-.06,2,g);floor.castShadow=false;
  box(W,3,.16,r.wall,cx,1.5,-5,g);
  box(W,.12,.18,r.dark?0xFF7A3D:0x111111,cx,.06,-4.9,g);
  if(ri<ROOMS.length-1){box(.16,2.2,3.7,0xFFFFFF,x0+W,1.1,-3.15,g);box(.18,.12,3.7,0x111111,x0+W,2.2,-3.15,g)}
  if(ri===0)box(.16,2.2,3.7,0xFFFFFF,x0,1.1,-3.15,g);
  // room sign on the back wall
  const sign=canvasPlane(3.2,.55,640,(c,w,h)=>{c.fillStyle=r.dark?'#FF7A3D':'#111';c.beginPath();c.roundRect(0,0,w,h,h/2);c.fill();
    c.fillStyle=r.dark?'#111':'#F2F1EC';c.font=font(500,44,'DM Mono');c.textAlign='center';c.textBaseline='middle';c.fillText(`0${ri} · ${r.name.toUpperCase()}`,w/2,h/2+2)},g);
  sign.position.set(cx,2.68,-4.9);
  roomStart.push(stops.length);
  if(!n){stops.push({type:'stand',room:ri,seat:new THREE.Vector3(cx,0,AISLE_Z),aisle:new THREE.Vector3(cx,0,AISLE_Z)});}
  r.items.forEach((id,k)=>{
    const p=P[id],big=!!p.big,dx=x0+(W-(n-1)*SPACING)/2+k*SPACING;
    const dw=big?3.4:2.3;
    // desk
    box(dw,.08,1.1,0xF7F4EE,dx,.76,DESK_Z,g);
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>box(.06,.72,.06,0x222222,dx+a*(dw/2-.08),.36,DESK_Z+b*.47,g));
    box(dw-.2,.4,.04,0xE6E1D6,dx,.5,DESK_Z-.5,g);
    // monitor
    const mw=big?3:1.6,mh=mw*TH/TW,my=.82+.16+mh/2;
    box(.12,.18,.12,0x222222,dx,.88,DESK_Z-.25,g);
    box(mw+.08,mh+.08,.06,0x111111,dx,my,DESK_Z-.3,g);
    const scr=new THREE.Mesh(new THREE.PlaneGeometry(mw,mh),new THREE.MeshBasicMaterial({map:screenTexture(p),toneMapped:false}));
    scr.position.set(dx,my,DESK_Z-.265);scr.userData={p};g.add(scr);screens.push(scr);
    // keyboard, mug, little plant
    box(.7,.03,.22,0x2A2A2A,dx,.815,DESK_Z+.25,g);
    cyl(.06,.06,.12,[0xC6F432,0xFF7A3D,0xFFFFFF][k%3],dx+dw/2-.3,.86,DESK_Z+.2,g);
    if(k%2===0){cyl(.1,.08,.16,0xB46A4A,dx-dw/2+.25,.88,DESK_Z-.1,g);const lf=new THREE.Mesh(new THREE.IcosahedronGeometry(.16,0),mat(0x4F8A4B,{flatShading:true}));lf.position.set(dx-dw/2+.25,1.06,DESK_Z-.1);lf.castShadow=true;g.add(lf)}
    // office chair (seat + low back, sits behind the worker)
    cyl(.04,.04,.42,0x333333,dx,.22,SEAT_Z,g,8);
    box(.55,.08,.5,0x30343A,dx,.46,SEAT_Z,g);
    box(.5,.42,.07,0x30343A,dx,.72,SEAT_Z+.3,g);
    stops.push({type:'desk',room:ri,p,k,n,seat:new THREE.Vector3(dx,0,SEAT_Z+.05),aisle:new THREE.Vector3(dx,0,AISLE_Z),
      mon:new THREE.Vector3(dx,my,DESK_Z-.265),mw,mh});
  });
  decorate(ri,g,x0,W,cx);
  X+=W;
});
const N=stops.length;

/* ---------- Room decor ---------- */
function plant(g,x,z,s=1){cyl(.22*s,.17*s,.4*s,0xB46A4A,x,.2*s,z,g);for(let i=0;i<3;i++){const l=new THREE.Mesh(new THREE.IcosahedronGeometry(.32*s,0),mat(0x4F8A4B,{flatShading:true}));l.position.set(x+(i-1)*.15*s,(.6+i*.22)*s,z);l.castShadow=true;g.add(l)}}
function decorate(ri,g,x0,W,cx){
  if(ri===0){
    const s=canvasPlane(4,1.12,1000,(c,w,h)=>{c.fillStyle='#111';c.font=font(800,150);c.textBaseline='middle';c.fillText('Lucas Bui',20,h/2);
      c.fillStyle='#C6F432';c.beginPath();c.roundRect(700,h/2-36,280,72,10);c.fill();c.fillStyle='#111';c.font=font(500,34,'DM Mono');c.fillText('WEB DESIGNER',716,h/2+2)},g);
    s.position.set(cx,1.85,-4.9);
    box(3,1,.7,0x111111,cx,.5,-3.1,g);box(3.2,.08,.9,0xC6F432,cx,1.04,-3.1,g);
    plant(g,x0+1,-4,1.3);plant(g,x0+W-1,-4,1.1);
    const rug=new THREE.Mesh(new THREE.CircleGeometry(1.6,40),mat(0xC6F432));rug.rotation.x=-Math.PI/2;rug.position.set(cx,.01,AISLE_Z);rug.receiveShadow=true;g.add(rug);
  }
  if(ri===1){
    box(5.4,1.6,.08,0x6B5B4B,cx,1.75,-4.88,g);
    const wb=canvasPlane(5.2,1.4,1040,(c,w,h)=>{c.fillStyle='#FAFAF7';c.fillRect(0,0,w,h);c.fillStyle='#1F5D3A';c.font=font(500,40,'DM Mono');
      ['y = x³ − 3x','H₂O · NaCl · CO₂','a² + b² = c²'].forEach((t,i)=>c.fillText(t,40+i*330,90+(i%2)*80));
      c.strokeStyle='#C2643A';c.lineWidth=5;c.beginPath();for(let i=0;i<=200;i++){const xx=i/200*4-2;c.lineTo(80+i*4.2,230-(xx*xx*xx-3*xx)*28)}c.stroke()},g);
    wb.position.set(cx,1.75,-4.83);
    box(.9,2,.4,0x8B6B4A,x0+.8,1,-4.7,g);
    for(let i=0;i<8;i++)box(.1,.32,.26,[0xC2643A,0x6F8FD6,0xC6F432,0xE8D3A6][i%4],x0+.5+i*.09,1.45,-4.65,g);
  }
  if(ri===2){
    const cal=canvasPlane(2,1.5,600,(c,w,h)=>{c.fillStyle='#fff';c.fillRect(0,0,w,h);c.fillStyle='#111';c.font=font(800,48);c.fillText('SHIFTS',24,62);
      for(let r=0;r<4;r++)for(let k=0;k<7;k++){c.fillStyle=(r*7+k)%3===0?'#C6F432':'#E7E5DE';c.fillRect(24+k*80,96+r*84,70,72)}},g);
    cal.position.set(cx-1.6,1.9,-4.9);
    const cooler=new THREE.Group();g.add(cooler);cooler.position.set(x0+W-.7,0,-4.3);
    box(.5,1,.5,0xEDEDED,0,.5,0,cooler);cyl(.2,.2,.5,0x9FD3E6,0,1.25,0,cooler);
    box(.6,.5,.5,0x222222,cx+1.8,1.04,-4.6,g);plant(g,cx+2.8,-4.4,.9);
  }
  if(ri===3){
    const pg=new THREE.Group();pg.position.set(cx+2.3,2.35,-3.2);g.add(pg);
    const sp=new THREE.Mesh(new THREE.SphereGeometry(.42,32,20),new THREE.MeshStandardMaterial({color:0xFF7A3D,emissive:0xFF5A1F,emissiveIntensity:.8}));pg.add(sp);
    const ring=new THREE.Mesh(new THREE.TorusGeometry(.7,.02,8,64),mat(0xE8D3A6));ring.rotation.x=1.25;pg.add(ring);
    pg.add(new THREE.PointLight(0xFF7A3D,6,8));spinners.push(pg);
    const line=box(.01,.6,.01,0x888888,cx+2.3,2.75,-3.2,g);line.castShadow=false;
    const s=canvasPlane(3,.9,900,(c,w,h)=>{c.fillStyle='#FF7A3D';c.font=font(800,150);c.textBaseline='middle';c.fillText('URANUS',10,h/2+6)},g);
    s.position.set(cx-1.2,2.25,-4.9);
    plant(g,x0+.9,-4.2,1.1);
  }
  if(ri===4){
    const poster=canvasPlane(2.2,1.4,660,(c,w,h)=>{c.fillStyle='#E9E1CF';c.fillRect(0,0,w,h);
      [[0,'#6B8A5E',.55],[.25,'#3E5638',.35],[.55,'#5E7D52',.45]].forEach(([s,col,top])=>{c.fillStyle=col;c.beginPath();c.moveTo(s*w-60,h);c.lineTo(s*w+180,top*h);c.lineTo(s*w+420,h);c.fill()});
      c.fillStyle='#111';c.font=font(800,64);c.fillText('RENTTREK',24,70)},g);
    poster.position.set(cx-2.4,1.95,-4.9);
    const flute=canvasPlane(1.2,1.4,360,(c,w,h)=>{c.fillStyle='#211F1C';c.fillRect(0,0,w,h);c.fillStyle='#F2F1EC';c.font=font(400,96,'serif');c.textAlign='center';c.fillText('尺八',w/2,h/2+30)},g);
    flute.position.set(cx+.4,1.95,-4.9);
    for(let i=0;i<5;i++){const b=new THREE.Group();b.position.set(x0+W-.6-(i%2)*.25,0,-4.5+i*.12);g.add(b);
      for(let s=0;s<6;s++)cyl(.05,.05,.38,0xB9A05A,0,.2+s*.4,0,b,8)}
    for(let i=0;i<4;i++){const l=new THREE.Mesh(new THREE.SphereGeometry(.18,16,12),new THREE.MeshStandardMaterial({color:0xE0412F,emissive:0xC0281A,emissiveIntensity:.8}));
      l.scale.y=1.25;l.position.set(cx-3+i*2,2.65,-3.5);g.add(l)}
  }
  if(ri===5){
    box(1.3,2.3,.1,0x6B5B4B,cx+1.6,1.15,-4.88,g);cyl(.04,.04,.05,0xC6F432,cx+2.05,1.1,-4.8,g);
    const ex=canvasPlane(1,.36,300,(c,w,h)=>{c.fillStyle='#1F9D55';c.fillRect(0,0,w,h);c.fillStyle='#fff';c.font=font(800,70);c.textAlign='center';c.textBaseline='middle';c.fillText('EXIT',w/2,h/2+4)},g);
    ex.position.set(cx+1.6,2.55,-4.85);
    cyl(.03,.03,1.8,0x222222,cx-2,.9,-4.3,g);box(.5,.05,.05,0x222222,cx-2,1.75,-4.3,g);plant(g,cx-.8,-4.3,1.2);
  }
}

/* ---------- The office worker ---------- */
const worker=new THREE.Group();scene.add(worker);
const skin=0xE9B98F,shirt=0xFFFFFF,pants=0x2B2F38,hair=0x1E1A17;
const body=new THREE.Group();body.position.y=.9;worker.add(body);
box(.46,.6,.26,shirt,0,.32,0,body);
box(.08,.36,.02,0xC6F432,0,.36,.135,body);
const head=new THREE.Group();head.position.y=.82;body.add(head);
const hd=new THREE.Mesh(new THREE.SphereGeometry(.2,24,16),mat(skin));hd.castShadow=true;head.add(hd);
const hr=new THREE.Mesh(new THREE.SphereGeometry(.21,24,16,0,Math.PI*2,0,Math.PI*.55),mat(hair));hr.rotation.x=-.25;hr.position.y=.02;head.add(hr);
[-.07,.07].forEach(x=>{const e=new THREE.Mesh(new THREE.SphereGeometry(.022,8,6),mat(0x111111));e.position.set(x,.02,.185);head.add(e)});
const glasses=new THREE.Mesh(new THREE.TorusGeometry(.045,.008,6,16),mat(0x111111));
[-.07,.07].forEach(x=>{const g=glasses.clone();g.position.set(x,.02,.19);head.add(g)});
function limb(len,w,color,x,y){const pivot=new THREE.Group();pivot.position.set(x,y,0);const m=box(w,len,w,color,0,-len/2,0,pivot);return {pivot,m}}
const legs=[-.12,.12].map(x=>{const th=limb(.45,.16,pants,x,0);body.add(th.pivot);const sh=limb(.45,.14,pants,0,-.45);th.pivot.add(sh.pivot);
  box(.15,.08,.26,0x111111,0,-.47,.05,sh.pivot);return {hip:th.pivot,knee:sh.pivot}});
const arms=[-.3,.3].map(x=>{const a=limb(.55,.12,shirt,x,.58);body.add(a.pivot);const hand=new THREE.Mesh(new THREE.SphereGeometry(.065,10,8),mat(skin));hand.position.y=-.6;hand.castShadow=true;a.pivot.add(hand);return a.pivot});

/* ---------- Panels & navigation ---------- */
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ext='target="_blank" rel="noopener"';
document.getElementById('panels').innerHTML=stops.map((s,i)=>{
  const r=ROOMS[s.room];
  if(s.type==='stand')return `<section class="panel" aria-labelledby="h${i}"><span class="kicker mono"><b>0${s.room}</b>${r.name.toUpperCase()}</span><h2 id="h${i}">${esc(r.h)}</h2><p class="d">${esc(r.d)}</p>
    ${i===0?'<span class="hint mono">↓ SCROLL TO WALK</span>':''}
    ${r.cta?`<div class="btns"><a class="btn solid" href="mailto:vieveb.vn@gmail.com">vieveb.vn@gmail.com</a><a class="btn" href="https://github.com/sucalb" ${ext}>GitHub ↗</a></div>`:''}</section>`;
  const p=s.p;
  return `<section class="panel" aria-labelledby="h${i}"><span class="kicker mono"><b>0${s.room}</b>${r.name.toUpperCase()} — DESK ${s.k+1}/${s.n}</span>
    ${s.k===0?`<p class="story">${esc(r.story)}</p>`:''}<h2 id="h${i}">${esc(p.t)}</h2><span class="tech mono">${p.x}</span><p class="d">${esc(p.d)}</p>
    ${p.h?`<ul>${p.h.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
    <div class="btns"><a class="btn solid" href="${p.url}" ${ext}>Live site ↗</a>${p.repo?`<a class="btn" href="${GH+p.repo}" ${ext}>Code ↗</a>`:''}</div></section>`;
}).join('');
const panels=[...document.querySelectorAll('.panel')];
const dots=document.getElementById('dots');
dots.innerHTML=ROOMS.map((r,i)=>`<li><button type="button" data-i="${roomStart[i]}" aria-label="Go to ${r.name}"><span>${r.name}</span></button></li>`).join('');
const dotBtns=[...dots.querySelectorAll('button')];
const scroller=document.getElementById('scroller');scroller.style.height=((N-1)*110+100)+'vh';
const maxScroll=()=>document.documentElement.scrollHeight-innerHeight;
const goTo=i=>scrollTo({top:i/(N-1)*maxScroll(),behavior:reduce?'auto':'smooth'});
dots.addEventListener('click',e=>{const b=e.target.closest('button');if(b)goTo(+b.dataset.i)});
document.getElementById('home').addEventListener('click',e=>{e.preventDefault();goTo(0)});

/* ---------- Timeline: walk → sit → walk ---------- */
const clamp=THREE.MathUtils.clamp,sm=x=>x*x*(3-2*x);
const ph=(f,a,b)=>clamp((f-a)/(b-a),0,1);
const V=new THREE.Vector3();
function stateAt(s){
  const i=Math.min(Math.floor(s),N-2),f=s-i,A=stops[i],B=stops[i+1];
  const rise=sm(ph(f,.1,.22)),walk=sm(ph(f,.22,.78)),down=sm(ph(f,.78,.9));
  const st={pos:new THREE.Vector3(),sit:0,face:0,walking:0,dist:0,near:f<.5?i:i+1};
  if(f<.22){st.pos.lerpVectors(A.seat,A.aisle,rise);st.sit=A.type==='desk'?1-rise:0;st.face=A.type==='desk'?Math.PI:0}
  else if(f<=.78){st.pos.lerpVectors(A.aisle,B.aisle,walk);st.face=B.aisle.x>=A.aisle.x?Math.PI/2:-Math.PI/2;st.walking=1;st.dist=A.aisle.distanceTo(B.aisle)*walk}
  else{st.pos.lerpVectors(B.aisle,B.seat,down);st.sit=B.type==='desk'?down:0;st.face=B.type==='desk'?Math.PI:0}
  if(f>.22&&f<.26||f>.74&&f<.78)st.walking=.5;
  return st;
}

/* ---------- Camera framing ---------- */
const mobile=()=>innerWidth/innerHeight<1||innerWidth<=760;
function deskCam(stop,out,look){
  const asp=innerWidth/innerHeight,mob=mobile();
  let d=stop.mh/(2*TAN)/(mob?.32:.42);
  d=Math.max(d,(stop.mw/2)/(mob?.88:.5)/(TAN*asp));
  const hw=d*TAN*asp,hh=d*TAN;
  look.copy(stop.mon).add(V.set(0,.08,0));out.copy(stop.mon).add(V.set(0,.6,d));
  if(mob){look.y-=.34*hh;out.y-=.34*hh-.55;out.x+=.5}else{look.x-=.4*hw;out.x-=.4*hw}
}
function walkCam(pos,out,look){
  const asp=innerWidth/innerHeight,mob=mobile();
  const d=mob?10:7.5;
  look.copy(pos).add(V.set(0,1,-.6));out.copy(pos).add(V.set(0,mob?4.6:3.4,d));
  if(mob){look.y-=1.6}else{const hw=d*TAN*asp;look.x-=.3*hw;out.x-=.3*hw}
}
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

/* ---------- Loop ---------- */
let target=0,cur=0;
const readScroll=()=>{const m=maxScroll();target=m>0?scrollY/m*(N-1):0};
addEventListener('scroll',readScroll,{passive:true});readScroll();
const mouse=new THREE.Vector2(-9,-9),ray=new THREE.Raycaster(),tip=document.getElementById('tip');let hover=null,hasMouse=false;
addEventListener('pointermove',e=>{mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);hasMouse=e.pointerType==='mouse';tip.style.left=e.clientX+'px';tip.style.top=e.clientY+'px'});
const pick=()=>{ray.setFromCamera(mouse,camera);const h=ray.intersectObjects(screens,false)[0];return h&&h.object};
addEventListener('click',e=>{if(e.target.closest('a,button,.panel'))return;mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);const o=pick();if(o)open(o.userData.p.url,'_blank','noopener')});

const camPos=new THREE.Vector3(),camLook=new THREE.Vector3(),wp=new THREE.Vector3(),wl=new THREE.Vector3(),dp=new THREE.Vector3(),dl=new THREE.Vector3();
let first=true,face=0,swing=0,lastNear=-1,lastRoom=-1;
const bar=document.getElementById('bar'),clock=new THREE.Clock();
function frame(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  cur+=(target-cur)*(reduce?1:.09);
  const st=stateAt(cur),near=stops[st.near];
  // worker pose
  worker.position.copy(st.pos);
  let dF=st.face-face;dF=Math.atan2(Math.sin(dF),Math.cos(dF));face+=dF*(reduce?1:.14);worker.rotation.y=face;
  swing+=((st.walking?1:0)-swing)*.2;
  const step=st.dist*5.2,sit=st.sit;
  body.position.y=.9-.4*sit+(reduce?0:Math.abs(Math.sin(step))*.05*swing);
  legs.forEach((l,k)=>{const sw=Math.sin(step+k*Math.PI)*.55*swing;
    l.hip.rotation.x=THREE.MathUtils.lerp(sw,-Math.PI/2,sit);l.knee.rotation.x=THREE.MathUtils.lerp(Math.max(0,-sw)*.9,Math.PI/2,sit)});
  const typing=sit>.98&&!reduce,waving=near.type==='stand'&&Math.abs(cur-st.near)<.12;
  arms.forEach((a,k)=>{const sw=Math.sin(step+k*Math.PI+Math.PI)*.5*swing;
    let rx=THREE.MathUtils.lerp(sw,-1.15,sit),rz=k?-.08:.08;
    if(typing)rx+=Math.sin(t*14+k*2)*.06;
    if(waving&&k===1){rx=-.2;rz=2.5+Math.sin(t*8)*.35}
    a.rotation.x+= (rx-a.rotation.x)*.25;a.rotation.z+=(rz-a.rotation.z)*.25});
  head.rotation.x=THREE.MathUtils.lerp(0,.12,sit);
  // camera: blend between follow cam and over-the-shoulder desk cam
  walkCam(st.pos,wp,wl);
  if(near.type==='desk'){deskCam(near,dp,dl);wp.lerp(dp,sit);wl.lerp(dl,sit)}
  if(first){camPos.copy(wp);camLook.copy(wl);first=false}
  const k=reduce?1:.08;camPos.lerp(wp,k);camLook.lerp(wl,k);
  camera.position.copy(camPos);camera.lookAt(camLook);
  sun.position.copy(st.pos).add(V.set(4,9,6));sun.target.position.copy(st.pos);
  // UI
  panels.forEach((el,i)=>{const o=clamp(1-(Math.abs(cur-i)-.1)/.12,0,1);el.style.opacity=o;el.classList.toggle('on',o>.02);el.style.pointerEvents=o>.5?'auto':'none'});
  const room=stops[Math.round(cur)].room;if(room!==lastRoom){lastRoom=room;dotBtns.forEach((b,i)=>b.setAttribute('aria-current',i===room))}
  bar.style.transform=`scaleX(${cur/(N-1)})`;
  const o=hasMouse?pick():null;
  if(o!==hover){hover=o;document.body.style.cursor=o?'pointer':'';tip.textContent=o?`Open ${o.userData.p.t} ↗`:'';tip.style.opacity=o?1:0}
  if(!reduce)spinners.forEach(s=>s.rotation.y+=dt*.6);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
